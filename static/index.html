<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Orçamento — RC Suporte</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-[#0097b2] text-white px-6 py-3 flex items-center justify-between shadow">
    <span class="font-bold text-lg tracking-wide">RC Suporte — Gerador de Orçamentos</span>
    <a href="/historico.html" class="text-sm underline hover:text-blue-100">Ver Histórico →</a>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-gray-700 mb-6">Novo Orçamento</h1>

    <!-- Dados do Cliente -->
    <section class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-base font-semibold text-[#0097b2] uppercase mb-4">Dados do Cliente</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Nome da Empresa <span class="text-red-500">*</span></label>
          <input id="cliente_nome" type="text" placeholder="Ex: Hospital Ipiranga"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">A/C (Contato) <span class="text-red-500">*</span></label>
          <input id="cliente_contato" type="text" placeholder="Ex: Sr. Eduardo Nobuo"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">CNPJ / CPF</label>
          <input id="cliente_cnpj" type="text" placeholder="Ex: 12.345.678/0001-90"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Telefone</label>
          <input id="cliente_telefone" type="text" placeholder="Ex: (11) 98765-4321"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">Endereço <span class="text-red-500">*</span></label>
          <input id="cliente_endereco" type="text" placeholder="Ex: R. da Bica, 120 – São Bernardo do Campo - SP"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">E-mail</label>
          <input id="cliente_email" type="email" placeholder="Ex: contato@empresa.com.br"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
      </div>
    </section>

    <!-- Dados da Proposta -->
    <section class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-base font-semibold text-[#0097b2] uppercase mb-4">Dados da Proposta</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">Descrição do Orçamento</label>
          <input id="descricao_intro" type="text" placeholder="Ex: instalação de câmeras IP e cabeamento Cat6"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Condição de Pagamento (Opção 2)</label>
          <input id="condicao_pagto" type="text" value="até 28 dias"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Validade da Proposta (dias)</label>
          <input id="validade_dias" type="number" value="7" min="1" max="60"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
      </div>
    </section>

    <!-- Itens -->
    <section class="mb-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold text-[#0097b2] uppercase">Itens do Orçamento</h2>
        <button onclick="adicionarCategoria()"
          class="bg-[#0097b2] text-white text-sm px-4 py-2 rounded-lg hover:bg-[#007d96] transition">
          + Adicionar Categoria
        </button>
      </div>
      <div id="categorias-container"></div>
    </section>

    <!-- Total -->
    <div id="total-geral" class="bg-[#0097b2] rounded-lg p-4 mb-6 text-right hidden">
      <span class="font-bold text-white text-lg">VALOR TOTAL GERAL: </span>
      <span id="total-valor" class="font-bold text-white text-lg"></span>
    </div>

    <div class="flex justify-end gap-3">
      <button onclick="salvarEGerarPDF()"
        class="bg-green-600 text-white font-semibold px-8 py-3 rounded-xl hover:bg-green-700 transition shadow">
        Salvar e Gerar PDF
      </button>
    </div>
  </main>

    let categoriaCount = 0;

    function adicionarCategoria() {
      const id = categoriaCount++;
      const container = document.getElementById('categorias-container');
      const div = document.createElement('div');
      div.className = 'bg-white rounded-xl shadow p-5 mb-4';
      div.id = `cat-${id}`;
      div.innerHTML = `
        <div class="flex items-center gap-3 mb-4 flex-wrap">
          <select id="cat-tipo-${id}" onchange="mudouTipoCategoria(${id})"
            class="border border-gray-300 rounded-lg px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
            <option value="">-- Selecione o Tipo --</option>
            <option value="CAMERAS">CÂMERAS</option>
            <option value="NVR">GRAVADORES NVR</option>
            <option value="REDE">EQUIPAMENTOS DE REDE</option>
            <option value="CABEAMENTO">CABEAMENTO</option>
            <option value="MAO_DE_OBRA">MÃO DE OBRA</option>
            <option value="PERSONALIZADO">PERSONALIZADO</option>
          </select>
          <input type="text" placeholder="Nome da Categoria"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm font-semibold uppercase focus:outline-none focus:ring-2 focus:ring-[#0097b2] hidden"
            id="cat-titulo-personalizado-${id}">
          <button onclick="document.getElementById('cat-${id}').remove(); recalcularTotal()"
            class="text-red-400 hover:text-red-600 text-sm ml-auto">Remover Categoria</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm border-collapse">
            <thead>
              <tr class="bg-[#e8f7fa] text-[#0097b2]">

                <th class="border border-gray-200 px-2 py-2 text-left">Item</th>
                <th class="border border-gray-200 px-2 py-2 text-left w-24">Garantia</th>
                <th class="border border-gray-200 px-2 py-2 text-center w-14">Qtd</th>
                <th class="border border-gray-200 px-2 py-2 text-right w-28">Vl. Unit.</th>
                <th class="border border-gray-200 px-2 py-2 text-right w-28">Vl. Total</th>
                <th class="border border-gray-200 px-2 py-2 w-8"></th>
              </tr>
            </thead>
            <tbody id="itens-${id}"></tbody>
          </table>
        </div>
        <button onclick="adicionarItem(${id})"
          class="mt-3 text-sm text-[#0097b2] hover:underline">+ Adicionar Item</button>
      `;
      container.appendChild(div);

    function mudouTipoCategoria(catId) {
      const select = document.getElementById(`cat-tipo-${catId}`);
      const inputPersonalizado = document.getElementById(`cat-titulo-personalizado-${catId}`);
      const tipo = select.value;

      if (tipo === 'PERSONALIZADO') {
        inputPersonalizado.classList.remove('hidden');
        select.classList.remove('flex-1');
        select.classList.add('w-48');
      } else {
        inputPersonalizado.classList.add('hidden');
        select.classList.add('flex-1');
        select.classList.remove('w-48');
      }

      document.getElementById(`itens-${catId}`).innerHTML = '';
    }

    function adicionarItem(catId) {
      const tipo = document.getElementById(`cat-tipo-${catId}`)?.value;
      if (!tipo) {
        alert('Selecione primeiro o tipo da categoria!');
        return;
      }

      const tbody = document.getElementById(`itens-${catId}`);
      const rowId = Date.now() + Math.random();

      let lista = [];
      if (tipo === 'CAMERAS') lista = cameras;
      else if (tipo === 'NVR') lista = nvr;
      else if (tipo === 'REDE') lista = rede;
      else if (tipo === 'CABEAMENTO') lista = cabecamento;
      else if (tipo === 'MAO_DE_OBRA') lista = maoDeObra;

      let options = lista.map((item, i) =>
        `<option value="${i}" data-preco="${item.preco}" data-desc="${item.descricao}">${item.descricao}</option>`
      ).join('');

      const tr = document.createElement('tr');
      tr.id = `item-${rowId}`;
      tr.className = 'hover:bg-gray-50';
      tr.innerHTML = `
        <td class="border border-gray-200 px-1 py-1 text-center text-gray-400 text-xs" id="num-${rowId}">1</td>
        <td class="border border-gray-200 px-1 py-1">
          ${tipo === 'PERSONALIZADO'
            ? `<input type="text" placeholder="Descrição do item" class="w-full border border-gray-200 rounded px-2 py-1 text-sm" id="desc-${rowId}">`
            : `<select class="w-full border border-gray-200 rounded px-2 py-1 text-sm" id="desc-${rowId}" onchange="mudouItem(${rowId}, ${catId})">
                <option value="">-- Selecione --</option>
                ${options}
              </select>`
          }
        </td>
        <td class="border border-gray-200 px-1 py-1">
          <input type="text" value="12 Meses" class="w-full border border-gray-200 rounded px-2 py-1 text-sm" id="gar-${rowId}">
        </td>
        <td class="border border-gray-200 px-1 py-1">
          <input type="number" value="1" min="1" class="w-full border border-gray-200 rounded px-2 py-1 text-sm text-center" id="qtd-${rowId}"
            oninput="calcularLinha(${rowId})">
        </td>
        <td class="border border-gray-200 px-1 py-1">
          <input type="number" value="0" step="0.01" class="w-full border border-gray-200 rounded px-2 py-1 text-sm text-right" id="vun-${rowId}"
            oninput="calcularLinha(${rowId})">
        </td>
        <td class="border border-gray-200 px-1 py-1 text-right font-semibold text-sm pr-2 text-[#0097b2]" id="vtot-${rowId}">R$ 0,00</td>
        <td class="border border-gray-200 px-1 py-1 text-center">
          <button onclick="removerItem(${rowId}, ${catId})"
            class="text-red-400 hover:text-red-600 text-xs font-bold">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
      renumerar(catId);
    }

    function removerItem(rowId, catId) {
      document.getElementById(`item-${rowId}`)?.remove();
      recalcularTotal();
      renumerar(catId);
    }

    function renumerar(catId) {
      const tbody = document.getElementById(`itens-${catId}`);
      let num = 1;
      tbody.querySelectorAll('tr').forEach(tr => {
        const rowId = tr.id.replace('item-', '');
        const numEl = document.getElementById(`num-${rowId}`);
        if (numEl) numEl.textContent = num++;
      });
    }

    function mudouItem(rowId, catId) {
      const select = document.getElementById(`desc-${rowId}`);
      const preco = parseFloat(select.options[select.selectedIndex]?.dataset?.preco) || 0;
      document.getElementById(`vun-${rowId}`).value = preco.toFixed(2);
      calcularLinha(rowId);
    }

    function calcularLinha(rowId) {
      const qtd = parseFloat(document.getElementById(`qtd-${rowId}`)?.value) || 0;
      const vun = parseFloat(document.getElementById(`vun-${rowId}`)?.value) || 0;
      document.getElementById(`vtot-${rowId}`).textContent = formatarMoeda(qtd * vun);
      recalcularTotal();
    }

    function recalcularTotal() {
      let total = 0;
      document.querySelectorAll('[id^="vtot-"]').forEach(el => {
        const txt = el.textContent.replace('R$ ', '').replace(/\./g, '').replace(',', '.');
        total += parseFloat(txt) || 0;
      });
      const el = document.getElementById('total-geral');
      el.classList.toggle('hidden', total === 0);
      document.getElementById('total-valor').textContent = formatarMoeda(total);
    }

    function formatarMoeda(val) {
      return 'R$ ' + val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function coletarDados() {
      const categorias = [];
      document.querySelectorAll('[id^="cat-"]').forEach(catEl => {
        const catId = catEl.id.replace('cat-', '');
        const tipo = document.getElementById(`cat-tipo-${catId}`)?.value;
        let titulo = '';

        if (tipo === 'PERSONALIZADO') {
          titulo = document.getElementById(`cat-titulo-personalizado-${catId}`)?.value?.trim();
        } else if (tipo) {
          titulo = tipo;
        }
        if (!titulo) return;

        const itens = [];
        catEl.querySelectorAll('tbody tr').forEach(tr => {
          const rowId = tr.id.replace('item-', '');
          const garantia = document.getElementById(`gar-${rowId}`)?.value?.trim() || '';

          let descricao = '';
          const descInput = document.getElementById(`desc-${rowId}`);
          if (descInput?.tagName === 'SELECT') {
            descricao = descInput.options[descInput.selectedIndex]?.dataset?.desc || '';
          } else {
            descricao = descInput?.value?.trim() || '';
          }

          const quantidade = parseInt(document.getElementById(`qtd-${rowId}`)?.value) || 0;
          const valor_unitario = parseFloat(document.getElementById(`vun-${rowId}`)?.value) || 0;
          if (descricao && quantidade > 0) itens.push({ garantia, descricao, quantidade, valor_unitario });
        });
        if (itens.length) categorias.push({ titulo, itens });
      });

      return {
        cliente_nome: document.getElementById('cliente_nome').value.trim(),
        cliente_contato: document.getElementById('cliente_contato').value.trim(),
        cliente_endereco: document.getElementById('cliente_endereco').value.trim(),
        cliente_cnpj: document.getElementById('cliente_cnpj').value.trim() || null,
        cliente_email: document.getElementById('cliente_email').value.trim() || null,
        cliente_telefone: document.getElementById('cliente_telefone').value.trim() || null,
        condicao_pagto: document.getElementById('condicao_pagto').value.trim(),
        descricao_intro: document.getElementById('descricao_intro').value.trim(),
        validade_dias: parseInt(document.getElementById('validade_dias').value) || 7,
        categorias,
      };
    }

    async function salvarEGerarPDF() {
      const dados = coletarDados();
      if (!dados.cliente_nome || !dados.categorias.length) {
        alert('Preencha o nome do cliente e adicione pelo menos uma categoria com itens.');
        return;
      }

      const btn = document.querySelector('button[onclick="salvarEGerarPDF()"]');
      btn.textContent = 'Gerando PDF...';
      btn.disabled = true;

      try {
        const resp = await fetch('/orcamentos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados),
        });
        if (!resp.ok) throw new Error(await resp.text());
        const orc = await resp.json();
        window.location.href = `/orcamentos/${orc.id}/pdf`;
      } catch (err) {
        alert('Erro ao gerar orçamento: ' + err.message);
        btn.textContent = 'Salvar e Gerar PDF';
        btn.disabled = false;
      }
    }

    adicionarCategoria();
  </script>
</body>
</html>
