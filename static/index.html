<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — SaaS Budgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared.css">
    <style>
        /* ── KPI Cards ───────────────────────────────────────────────── */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 640px)  { .kpi-grid { grid-template-columns: 1fr; } }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.5s ease both;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--kpi-accent, var(--primary));
            border-radius: 20px 20px 0 0;
        }
        .kpi-card:nth-child(1) { --kpi-accent: #3a7bd5; animation-delay: 0.05s; }
        .kpi-card:nth-child(2) { --kpi-accent: #10b981; animation-delay: 0.10s; }
        .kpi-card:nth-child(3) { --kpi-accent: #8b5cf6; animation-delay: 0.15s; }
        .kpi-card:nth-child(4) { --kpi-accent: #f59e0b; animation-delay: 0.20s; }

        .kpi-icon {
            width: 54px; height: 54px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
            background: color-mix(in srgb, var(--kpi-accent) 15%, transparent);
            color: var(--kpi-accent);
        }
        .kpi-info { flex: 1; min-width: 0; }
        .kpi-label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
        .kpi-value { display: block; font-size: 28px; font-weight: 800; line-height: 1; color: var(--text-main); }
        .kpi-sub   { display: block; font-size: 12px; margin-top: 6px; color: var(--text-muted); }
        .kpi-sub.up   { color: #10b981; }
        .kpi-sub.down { color: #ef4444; }

        /* ── Main Grid ───────────────────────────────────────────────── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
        }
        @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr; } }

        /* ── Status donut ────────────────────────────────────────────── */
        .donut-wrap {
            position: relative;
            width: 180px; height: 180px;
            margin: 0 auto 24px;
        }
        .donut-center {
            position: absolute;
            inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: none;
        }
        .donut-total   { font-size: 28px; font-weight: 800; line-height: 1; }
        .donut-caption { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .status-legend { display: flex; flex-direction: column; gap: 10px; }
        .legend-item {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .legend-label { font-size: 13px; flex: 1; }
        .legend-count { font-weight: 700; font-size: 13px; }
        .legend-bar-wrap { flex: 1; height: 5px; border-radius: 99px; background: var(--glass-border); overflow: hidden; }
        .legend-bar { height: 100%; border-radius: 99px; transition: width 0.8s ease; }

        /* ── Conversion bar ──────────────────────────────────────────── */
        .conv-bar-wrap {
            height: 10px; border-radius: 99px;
            background: var(--glass-border); overflow: hidden; margin-top: 8px;
        }
        .conv-bar {
            height: 100%; border-radius: 99px;
            background: linear-gradient(90deg, #10b981, #00d2ff);
            transition: width 1s ease;
        }

        /* ── Activity feed ───────────────────────────────────────────── */
        .activity-list { display: flex; flex-direction: column; gap: 10px; }
        .activity-item {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 14px; border-radius: 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            transition: background 0.2s;
            text-decoration: none; color: inherit;
        }
        .activity-item:hover { background: rgba(58,123,213,0.06); }
        .activity-avatar {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 14px; flex-shrink: 0;
            background: rgba(58,123,213,0.12); color: var(--primary);
        }
        .activity-info { flex: 1; min-width: 0; }
        .activity-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .activity-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .activity-right { text-align: right; flex-shrink: 0; }
        .activity-val { font-weight: 700; font-size: 13px; }
        .activity-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .badge {
            display: inline-block; font-size: 10px; padding: 3px 9px;
            border-radius: 6px; font-weight: 700; text-transform: uppercase; white-space: nowrap;
        }

        /* ── Animations ──────────────────────────────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .glass-panel { animation: fadeUp 0.5s ease both; }
        .glass-panel:nth-child(1) { animation-delay: 0.25s; }
        .glass-panel:nth-child(2) { animation-delay: 0.35s; }
        
        /* ── Responsive ─────────────────────────────────────── */
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start !important; gap: 15px !important; }
            h1 { font-size: 20px; }
            #greeting { font-size: 22px; }
            .btn-primary { width: 100%; justify-content: center; }
            .glass-panel { padding: 15px; }
            .donut-wrap { width: 140px; height: 140px; }
            .activity-item { padding: 10px 12px; }
            .activity-avatar { width: 34px; height: 34px; font-size: 12px; }
        }
        
        @media (max-width: 480px) {
            .main-content { padding: 10px; }
            .kpi-card { padding: 14px; }
            .kpi-icon { width: 42px; height: 42px; font-size: 18px; }
            .kpi-value { font-size: 22px; }
            .kpi-label, .kpi-sub { font-size: 11px; }
            .donut-wrap { width: 120px; height: 120px; }
            .donut-total { font-size: 22px; }
            .status-legend { gap: 6px; }
            .legend-item { flex-wrap: wrap; }
            .conv-bar-wrap { margin-top: 12px; }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-bolt"></i> <span>SaaS Budgets</span></div>
        <a href="/" class="nav-link active"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="/novo_orcamento.html" class="nav-link"><i class="fas fa-plus-circle"></i> Novo Orçamento</a>
        <a href="/historico.html" class="nav-link"><i class="fas fa-history"></i> Histórico</a>
        <a href="/clientes.html" class="nav-link"><i class="fas fa-users"></i> Clientes</a>
        <a href="/catalogo.html" class="nav-link"><i class="fas fa-box-open"></i> Catálogo</a>
        <div style="margin-top: auto;">
            <button class="nav-link" onclick="toggleTheme()" style="width: 100%; border: none; background: transparent; cursor: pointer;">
                <i class="fas fa-adjust" id="theme-icon"></i> <span id="theme-text">Modo Claro</span>
            </button>
            <a href="javascript:void(0)" class="nav-link" onclick="logout()" style="color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
            </a>
            <a href="/configuracoes.html" class="nav-link"><i class="fas fa-cog"></i> Configurações</a>
        </div>
    </div>

    <div class="mobile-header">
        <div class="logo" style="margin:0"><i class="fas fa-bolt"></i></div>
        <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>

    <main class="main-content">

        <!-- Header -->
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:12px;">
            <div>
                <h1 style="font-size:26px; font-weight:800;" id="greeting">Olá 👋</h1>
                <p style="color:var(--text-muted); font-size:14px; margin-top:3px;" id="current-date"></p>
            </div>
            <a href="/novo_orcamento.html" class="btn btn-primary"><i class="fas fa-plus"></i> Novo Orçamento</a>
        </header>

        <!-- KPIs -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon"><i class="fas fa-file-invoice-dollar"></i></div>
                <div class="kpi-info">
                    <span class="kpi-label">Orçamentos no Mês</span>
                    <span class="kpi-value" id="kpi-total">—</span>
                    <span class="kpi-sub" id="kpi-total-sub"></span>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon"><i class="fas fa-check-circle"></i></div>
                <div class="kpi-info">
                    <span class="kpi-label">Aprovados no Mês</span>
                    <span class="kpi-value" id="kpi-aprovados">—</span>
                    <span class="kpi-sub up" id="kpi-conversao-label"></span>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon"><i class="fas fa-hand-holding-usd"></i></div>
                <div class="kpi-info">
                    <span class="kpi-label">Receita Aprovada</span>
                    <span class="kpi-value" id="kpi-aprovado-val">—</span>
                    <span class="kpi-sub" id="kpi-total-val-sub"></span>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon"><i class="fas fa-bullseye"></i></div>
                <div class="kpi-info">
                    <span class="kpi-label">Taxa de Conversão</span>
                    <span class="kpi-value" id="kpi-taxa">—</span>
                    <div class="conv-bar-wrap" style="margin-top:8px;">
                        <div class="conv-bar" id="conv-bar" style="width:0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">

            <!-- Status breakdown -->
            <div class="glass-panel">
                <h2 style="font-size:16px; font-weight:700; margin-bottom:22px;">
                    <i class="fas fa-chart-donut" style="color:var(--primary); margin-right:8px;"></i>
                    Distribuição por Status
                </h2>

                <div class="donut-wrap">
                    <canvas id="donutChart"></canvas>
                    <div class="donut-center">
                        <span class="donut-total" id="donut-total">0</span>
                        <span class="donut-caption">total</span>
                    </div>
                </div>

                <div class="status-legend" id="status-legend"></div>

                <div style="margin-top:24px; padding-top:18px; border-top:1px solid var(--glass-border);">
                    <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:6px;">
                        <span><i class="fas fa-percent" style="margin-right:5px;"></i>Conversão do Mês</span>
                        <span id="conv-pct-label" style="font-weight:700; color:var(--text-main);"></span>
                    </div>
                    <div class="conv-bar-wrap" style="height:8px;">
                        <div class="conv-bar" id="conv-bar-2" style="width:0%"></div>
                    </div>
                </div>
            </div>

            <!-- Atividade Recente -->
            <div class="glass-panel">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
                    <h2 style="font-size:16px; font-weight:700;">
                        <i class="fas fa-clock" style="color:var(--primary); margin-right:8px;"></i>
                        Atividade Recente
                    </h2>
                    <a href="/historico.html" style="font-size:12px; color:var(--primary); text-decoration:none; font-weight:600;">
                        Ver todos <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
                <div class="activity-list" id="activity-list">
                    <div style="text-align:center; padding:40px; color:var(--text-muted);">
                        <i class="fas fa-spinner fa-spin" style="font-size:24px;"></i>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="/shared.js?v=1.2"></script>
    <script>
        // ── Helpers ──────────────────────────────────────────────────────────
        const STATUS_COLORS = {
            'Aprovado':    { bg: 'rgba(16,185,129,0.15)',  color: '#10b981',  dot: '#10b981',  chart: '#10b981' },
            'Aguardando':  { bg: 'rgba(245,158,11,0.15)',  color: '#f59e0b',  dot: '#f59e0b',  chart: '#f59e0b' },
            'Recusado':    { bg: 'rgba(239,68,68,0.15)',   color: '#ef4444',  dot: '#ef4444',  chart: '#ef4444' },
            'Visualizado': { bg: 'rgba(0,210,255,0.15)',   color: '#00d2ff',  dot: '#00d2ff',  chart: '#00d2ff' },
        };

        function badge(status) {
            const s = STATUS_COLORS[status] || { bg: 'rgba(148,163,184,0.1)', color: '#94a3b8' };
            return `<span class="badge" style="background:${s.bg};color:${s.color};">${status}</span>`;
        }

        function moeda(v) {
            return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function initials(nome) {
            return (nome || '?').split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
        }

        function avatarColor(nome) {
            const colors = ['#3a7bd5','#10b981','#8b5cf6','#f59e0b','#ef4444','#00d2ff','#ec4899'];
            let h = 0;
            for (const c of nome) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
            return colors[h % colors.length];
        }

        // ── Date / Greeting ──────────────────────────────────────────────────
        (function () {
            const h = new Date().getHours();
            const g = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
            document.getElementById('greeting').textContent = `${g} 👋`;
            document.getElementById('current-date').textContent =
                new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
        })();

        // ── Donut Chart ──────────────────────────────────────────────────────
        let donutChart = null;

        function buildDonut(porStatus) {
            const labels = Object.keys(porStatus);
            const values = Object.values(porStatus);
            const colors = labels.map(l => (STATUS_COLORS[l] || { chart: '#94a3b8' }).chart);
            const total  = values.reduce((a, b) => a + b, 0);

            document.getElementById('donut-total').textContent = total;

            const isDark = document.body.classList.contains('dark-mode');
            const ctx = document.getElementById('donutChart').getContext('2d');

            if (donutChart) donutChart.destroy();
            donutChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
                options: {
                    cutout: '72%',
                    plugins: { legend: { display: false }, tooltip: {
                        callbacks: {
                            label: ctx => ` ${ctx.label}: ${ctx.parsed} (${total ? Math.round(ctx.parsed/total*100) : 0}%)`
                        }
                    }},
                    animation: { animateRotate: true, duration: 800 },
                }
            });

            // Legend
            const legend = document.getElementById('status-legend');
            legend.innerHTML = labels.map((l, i) => {
                const pct = total ? Math.round(values[i] / total * 100) : 0;
                const c = (STATUS_COLORS[l] || { dot: '#94a3b8', color: '#94a3b8' });
                return `
                <div class="legend-item">
                    <span class="legend-dot" style="background:${c.dot};"></span>
                    <span class="legend-label">${l}</span>
                    <div class="legend-bar-wrap">
                        <div class="legend-bar" style="width:${pct}%; background:${c.dot};"></div>
                    </div>
                    <span class="legend-count" style="color:${c.color};">${values[i]}</span>
                </div>`;
            }).join('');
        }

        // ── Activity Feed ────────────────────────────────────────────────────
        function buildActivity(recentes) {
            const list = document.getElementById('activity-list');
            if (!recentes.length) {
                list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-muted);">Nenhuma atividade ainda.</div>`;
                return;
            }
            list.innerHTML = recentes.map(orc => {
                const color = avatarColor(orc.cliente);
                return `
                <a class="activity-item" href="/historico.html">
                    <div class="activity-avatar" style="background:${color}22; color:${color};">
                        ${initials(orc.cliente)}
                    </div>
                    <div class="activity-info">
                        <div class="activity-name">${orc.cliente}</div>
                        <div class="activity-meta">${orc.numero} &nbsp;·&nbsp; ${badge(orc.status)}</div>
                    </div>
                    <div class="activity-right">
                        <div class="activity-val">${moeda(orc.valor)}</div>
                        <div class="activity-date">${orc.data}</div>
                    </div>
                </a>`;
            }).join('');
        }

        // ── Load ─────────────────────────────────────────────────────────────
        async function loadData() {
            const res = await apiFetch('/api/dashboard/stats');
            if (!res) return;
            const d = await res.json();

            // KPIs
            document.getElementById('kpi-total').textContent     = d.total_orcados;
            document.getElementById('kpi-total-sub').textContent = `R$ ${(d.valor_total_mes||0).toLocaleString('pt-BR', {minimumFractionDigits:2})} em propostas`;
            document.getElementById('kpi-aprovados').textContent = d.total_aprovados;
            document.getElementById('kpi-conversao-label').textContent = `${d.taxa_conversao}% de conversão`;
            document.getElementById('kpi-aprovado-val').textContent = moeda(d.valor_aprovado_mes || 0);
            document.getElementById('kpi-total-val-sub').textContent =
                d.valor_total_mes ? `${Math.round((d.valor_aprovado_mes||0) / d.valor_total_mes * 100)}% do total orçado` : '';
            document.getElementById('kpi-taxa').textContent = `${d.taxa_conversao}%`;

            // Conversion bars
            const pct = Math.min(d.taxa_conversao, 100);
            document.getElementById('conv-bar').style.width   = pct + '%';
            document.getElementById('conv-bar-2').style.width = pct + '%';
            document.getElementById('conv-pct-label').textContent = `${d.taxa_conversao}%`;

            // Donut
            if (d.por_status && Object.keys(d.por_status).length) {
                buildDonut(d.por_status);
            }

            // Activity
            buildActivity(d.recentes || []);
        }

        window.addEventListener('themeChanged', () => {
            if (donutChart) { donutChart.destroy(); donutChart = null; }
            loadData();
        });

        loadData();
    </script>
</body>
</html>
