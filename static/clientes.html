<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes — SaaS Budgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared.css">
    <style>
        @media (max-width: 768px) {
            header { flex-direction: column !important; align-items: flex-start !important; gap: 15px !important; }
            h1 { font-size: 20px; }
            .glass-panel { padding: 15px; }
            .btn-primary { width: 100%; justify-content: center; }
        }
        
        @media (max-width: 480px) {
            .main-content { padding: 10px; }
            table { font-size: 13px; }
            th, td { padding: 10px 6px; }
            .table-container { margin: 0 -15px; padding: 0 15px; overflow-x: auto; }
            #modal { padding: 10px; }
            #modal .glass-panel { margin: 0; }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-bolt"></i> <span>SaaS Budgets</span></div>
        <a href="/" class="nav-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="/novo_orcamento.html" class="nav-link"><i class="fas fa-plus-circle"></i> Novo Orçamento</a>
        <a href="/historico.html" class="nav-link"><i class="fas fa-history"></i> Histórico</a>
        <a href="/clientes.html" class="nav-link active"><i class="fas fa-users"></i> Clientes</a>
        <a href="/catalogo.html" class="nav-link"><i class="fas fa-box-open"></i> Catálogo</a>
        <div style="margin-top: auto;">
            <button class="nav-link" onclick="toggleTheme()" style="width: 100%; border: none; background: transparent; cursor: pointer;">
                <i class="fas fa-adjust" id="theme-icon"></i> <span id="theme-text">Modo Claro</span>
            </button>
            <a href="javascript:void(0)" class="nav-link" onclick="logout()" style="color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
            </a>
            <a href="/configuracoes.html" class="nav-link"><i class="fas fa-cog"></i> Configurações</a>
        </div>
    </div>

    <div class="mobile-header">
        <div class="logo" style="margin:0"><i class="fas fa-bolt"></i></div>
        <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <div>
                <h1>Gestão de Clientes</h1>
                <p style="color: var(--text-muted);">Visualize e gerencie seu banco de dados de clientes.</p>
            </div>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="fas fa-user-plus"></i> Novo Cliente
            </button>
        </header>

        <div class="glass-panel">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome / Empresa</th>
                            <th>Contato</th>
                            <th>E-mail</th>
                            <th>Cidade</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="client-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Modal -->
    <div id="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; padding: 20px;">
        <div class="glass-panel" style="width: 100%; max-width: 500px; margin-bottom: 0;">
            <h2 id="modal-title" style="margin-bottom: 25px;">Novo Cliente</h2>
            <form id="client-form">
                <input type="hidden" id="client-id">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted);">Nome / Empresa</label>
                    <input type="text" id="nome" required style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; color: var(--text-main); outline: none;">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label style="display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted);">Contato</label>
                        <input type="text" id="contato" style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; color: var(--text-main); outline: none;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted);">Telefone</label>
                        <input type="text" id="telefone" style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; color: var(--text-main); outline: none;">
                    </div>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted);">E-mail</label>
                    <input type="email" id="email" style="width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; color: var(--text-main); outline: none;">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="button" class="btn" style="flex: 1; background: var(--glass-border);" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/shared.js?v=1.2"></script>
    <script>
        async function loadClients() {
            const res = await apiFetch('/api/clientes');
            if (!res) return;
            const clients = await res.json();
            document.getElementById('client-list').innerHTML = clients.map(c => `
                <tr>
                    <td style="font-weight: 700; color: var(--primary);">${c.nome}</td>
                    <td style="font-weight: 500;">${c.contato || '-'}</td>
                    <td>${c.email || '-'}</td>
                    <td>${c.cidade || '-'}</td>
                    <td style="text-align: right;">
                        <button class="btn-icon" onclick='editClient(${JSON.stringify(c)})'><i class="fas fa-edit"></i></button>
                        <button class="btn-icon" onclick="deleteClient(${c.id})" style="color: #ef4444;"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Nenhum cliente cadastrado.</td></tr>';
        }

        function openModal(client = null) {
            document.getElementById('modal').style.display = 'flex';
            const form = document.getElementById('client-form');
            form.reset();
            if(client) {
                document.getElementById('modal-title').innerText = 'Editar Cliente';
                document.getElementById('client-id').value = client.id;
                document.getElementById('nome').value = client.nome;
                document.getElementById('contato').value = client.contato || '';
                document.getElementById('email').value = client.email || '';
                document.getElementById('telefone').value = client.telefone || '';
            } else {
                document.getElementById('modal-title').innerText = 'Novo Cliente';
                document.getElementById('client-id').value = '';
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        document.getElementById('client-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('client-id').value;
            const data = {
                nome: document.getElementById('nome').value,
                contato: document.getElementById('contato').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/clientes/${id}` : '/api/clientes';
            const res = await apiFetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (res) {
                closeModal();
                loadClients();
            }
        };

        async function deleteClient(id) {
            if(confirm('Excluir este cliente?')) {
                const res = await apiFetch(`/api/clientes/${id}`, { method: 'DELETE' });
                if (res) loadClients();
            }
        }

        function editClient(c) { openModal(c); }
        loadClients();
    </script>
</body>
</html>
