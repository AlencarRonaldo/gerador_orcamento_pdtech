<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico — SaaS Budgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared.css">
    <style>
        .btn-icon i { pointer-events: none; }
        .toast-container {
            position: fixed; bottom: 24px; right: 24px;
            z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            padding: 12px 20px; border-radius: 12px;
            color: white; font-weight: 600; font-size: 14px;
            animation: toastIn 0.3s ease; max-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .toast.success { background: #10b981; }
        .toast.error   { background: #ef4444; }
        .toast.info    { background: var(--primary, #3a7bd5); }
        @keyframes toastIn {
            from { transform: translateX(110%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
        .badge-status { display: inline-block; }
        
        @media (max-width: 768px) {
            header { flex-direction: column !important; align-items: flex-start !important; gap: 15px !important; }
            h1 { font-size: 20px; }
            table { font-size: 13px; }
            th, td { padding: 10px 8px; }
            .table-container { margin: 0 -15px; padding: 0 15px; overflow-x: auto; }
            div[style*="display: flex"] { justify-content: flex-end !important; }
        }
        
        @media (max-width: 480px) {
            .main-content { padding: 10px; }
            .glass-panel { padding: 12px; }
            .btn-icon { width: 32px; height: 32px; }
            h1 { font-size: 18px; }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-bolt"></i> <span>SaaS Budgets</span></div>
        <a href="/" class="nav-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="/novo_orcamento.html" class="nav-link"><i class="fas fa-plus-circle"></i> Novo Orçamento</a>
        <a href="/historico.html" class="nav-link active"><i class="fas fa-history"></i> Histórico</a>
        <a href="/clientes.html" class="nav-link"><i class="fas fa-users"></i> Clientes</a>
        <a href="/catalogo.html" class="nav-link"><i class="fas fa-box-open"></i> Catálogo</a>
        <div style="margin-top: auto;">
            <button class="nav-link" onclick="toggleTheme()" style="width: 100%; border: none; background: transparent; cursor: pointer;">
                <i class="fas fa-adjust" id="theme-icon"></i> <span id="theme-text">Modo Claro</span>
            </button>
            <a href="javascript:void(0)" class="nav-link" onclick="logout()" style="color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
            </a>
            <a href="/configuracoes.html" class="nav-link"><i class="fas fa-cog"></i> Configurações</a>
        </div>
    </div>

    <div class="mobile-header">
        <div class="logo" style="margin:0"><i class="fas fa-bolt"></i></div>
        <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 12px;">
            <h1>Histórico de Orçamentos</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="background: rgba(139, 92, 246, 0.15); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3);" onclick="copiarLinkCadastro()">
                    <i class="fas fa-share-alt"></i> Compartilhar Link de Cadastro
                </button>
                <a href="/novo_orcamento.html" class="btn btn-primary">+ Novo</a>
            </div>
        </header>

        <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
            <div style="position:relative; flex:1; min-width:200px;">
                <i class="fas fa-search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;"></i>
                <input type="text" id="filtro-busca" placeholder="Buscar por cliente ou número..."
                    style="width:100%;background:var(--bg-card);border:1px solid var(--glass-border);padding:10px 14px 10px 40px;border-radius:12px;color:var(--text-main);outline:none;box-sizing:border-box;"
                    oninput="filtrarHistorico()">
            </div>
            <select id="filtro-status" onchange="filtrarHistorico()"
                style="background:var(--bg-card);border:1px solid var(--glass-border);padding:10px 14px;border-radius:12px;color:var(--text-main);outline:none;min-width:150px;">
                <option value="">Todos os status</option>
                <option value="Aguardando">Aguardando</option>
                <option value="Visualizado">Visualizado</option>
                <option value="Aprovado">Aprovado</option>
                <option value="Recusado">Recusado</option>
            </select>
        </div>

        <div class="glass-panel">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nº Orçamento</th>
                            <th>Data</th>
                            <th>Cliente</th>
                            <th>Valor Total</th>
                            <th>Status</th>
                            <th>Visto</th>
                            <th>Consultor</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="orcamento-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/shared.js?v=1.2"></script>
    <script>
        let _todosOrcamentos = [];
        let _empresaNome = localStorage.getItem('empresa_nome') || 'Nossa Empresa';

        async function loadEmpresaNome() {
            try {
                const res = await apiFetch('/api/config');
                if (res && res.ok) {
                    const cfg = await res.json();
                    if (cfg.nome_empresa) {
                        _empresaNome = cfg.nome_empresa;
                        localStorage.setItem('empresa_nome', cfg.nome_empresa);
                    }
                }
            } catch (e) {}
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function loadHistorico() {
            const res = await apiFetch('/api/orcamentos');
            if (!res) return;
            const data = await res.json();
            _todosOrcamentos = data;
            
            // Verifica se tem ID na URL para focar no orçamento
            const urlParams = new URLSearchParams(window.location.search);
            const filterId = urlParams.get('id');
            if (filterId) {
                const filtered = data.filter(o => o.id == filterId);
                renderHistorico(filtered);
                // Scroll até o item
                setTimeout(() => {
                    const row = document.querySelector(`tr[data-id="${filterId}"]`);
                    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            } else {
                renderHistorico(data);
            }
        }

        function renderHistorico(lista) {
            document.getElementById('orcamento-list').innerHTML = lista.map(orc => {
                const uuid = orc.uuid_publico || '';
                const statusBadge = getStatusBadge(orc.status);
                const vistoTxt = orc.qtd_visualizacoes > 0
                    ? `<span style="color:var(--primary);font-weight:700;">${orc.qtd_visualizacoes}×</span>`
                    : `<span style="color:var(--text-muted);">—</span>`;
                return `
                <tr data-id="${orc.id}">
                    <td style="font-weight: 700; color: var(--primary);">${orc.numero}</td>
                    <td>${orc.data || '-'}</td>
                    <td style="font-weight: 500;">${orc.cliente_nome}</td>
                    <td style="font-weight: 600;">${orc.valor_total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                    <td>${statusBadge(orc.status)}</td>
                    <td>${vistoTxt}</td>
                    <td>${orc.consultor_nome || '-'}</td>
                    <td style="text-align: right;">
                        <div style="display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap;">
                            <button class="btn-icon" title="Aprovar" onclick="updateStatus(${orc.id}, 'Aprovado')" style="color: #10b981;"><i class="fas fa-check"></i></button>
                            <button class="btn-icon" title="Recusar" onclick="updateStatus(${orc.id}, 'Recusado')" style="color: #ef4444;"><i class="fas fa-times"></i></button>
                            <button class="btn-icon" title="Aguardando" onclick="updateStatus(${orc.id}, 'Aguardando')" style="color: #f59e0b;"><i class="fas fa-clock"></i></button>
                            <button class="btn-icon" title="Duplicar Orçamento" onclick="duplicarOrcamento(${orc.id})" style="color: #8b5cf6;"><i class="fas fa-copy"></i></button>
                            <button class="btn-icon" title="Editar Orçamento" onclick="window.location.href='/novo_orcamento.html?id=${orc.id}'" style="color: #f59e0b;"><i class="fas fa-edit"></i></button>
                            <button class="btn-icon" title="Enviar WhatsApp" onclick="sendWhatsApp('${uuid}', '${orc.cliente_telefone || ''}', '${orc.cliente_nome}', '${orc.numero}')" style="color: #25D366;"><i class="fab fa-whatsapp"></i></button>
                            <button class="btn-icon" title="Copiar Link Público" onclick="copyLink('${uuid}')"><i class="fas fa-link"></i></button>
                            <button class="btn-icon" title="Abrir Link Público" onclick="abrirLink('${uuid}')" style="color: var(--primary);"><i class="fas fa-external-link-alt"></i></button>
                            <button class="btn-icon" title="Ver PDF" onclick="window.open('/orcamentos/${orc.id}/pdf')"><i class="fas fa-file-pdf"></i></button>
                        </div>
                    </td>
                </tr>`;
            }).join('') || '<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Nenhum orçamento encontrado.</td></tr>';
        }

        function filtrarHistorico() {
            const busca = document.getElementById('filtro-busca').value.toLowerCase();
            const status = document.getElementById('filtro-status').value;
            const filtrado = _todosOrcamentos.filter(orc => {
                const matchBusca = !busca
                    || orc.cliente_nome.toLowerCase().includes(busca)
                    || orc.numero.toLowerCase().includes(busca);
                const matchStatus = !status || orc.status === status;
                return matchBusca && matchStatus;
            });
            renderHistorico(filtrado);
        }

        async function duplicarOrcamento(id) {
            const res = await apiFetch(`/orcamentos/${id}/duplicar`, { method: 'POST' });
            if (res && res.ok) {
                showToast('Orçamento duplicado!', 'success');
                loadHistorico();
            } else {
                showToast('Erro ao duplicar', 'error');
            }
        }
        
        function copiarLinkCadastro() {
            const link = window.location.origin + '/cadastro';
            navigator.clipboard.writeText(link).then(() => {
                showToast('Link de cadastro copiado!', 'success');
            }).catch(() => {
                showToast('Erro ao copiar link', 'error');
            });
        }

        function getStatusBadge(status) {
            return function(s) {
                const map = {
                    'aprovado':   ['rgba(16,185,129,0.15)',  '#10b981'],
                    'recusado':   ['rgba(239,68,68,0.15)',   '#ef4444'],
                    'visualizado':['rgba(58,123,213,0.15)',  'var(--primary)'],
                    'aguardando': ['rgba(245,158,11,0.15)',  '#f59e0b'],
                };
                const key = (s || '').toLowerCase();
                const [bg, color] = map[key] || ['rgba(148,163,184,0.1)', '#94a3b8'];
                return `<span style="background:${bg};color:${color};font-size:11px;padding:4px 10px;border-radius:6px;font-weight:700;text-transform:uppercase;display:inline-block;">${s}</span>`;
            };
        }

        async function updateStatus(id, newStatus) {
            try {
                const res = await apiFetch(`/api/orcamentos/${id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res && res.ok) {
                    showToast(`Status alterado para "${newStatus}"`, 'success');
                    loadHistorico();
                } else {
                    const text = res ? await res.text() : 'sem resposta';
                    console.error('Erro status:', text);
                    showToast('Erro ao atualizar status', 'error');
                }
            } catch (e) {
                console.error('Erro na requisição:', e);
                showToast('Falha na conexão', 'error');
            }
        }

        function copyLink(uuid) {
            if (!uuid) {
                showToast('Link não disponível para este orçamento', 'error');
                return;
            }
            const link = `${window.location.origin}/p/${uuid}`;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(link)
                    .then(() => showToast('Link copiado!', 'success'))
                    .catch(() => copyFallback(link));
            } else {
                copyFallback(link);
            }
        }

        function copyFallback(link) {
            const ta = document.createElement('textarea');
            ta.value = link;
            ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                showToast('Link copiado!', 'success');
            } catch (e) {
                showToast('Não foi possível copiar. Abra o link manualmente.', 'error');
            }
            document.body.removeChild(ta);
        }

        function abrirLink(uuid) {
            if (!uuid) { showToast('Link não disponível', 'error'); return; }
            window.open(`${window.location.origin}/p/${uuid}`, '_blank');
        }

        function sendWhatsApp(uuid, telefone, nome, numero) {
            if (!uuid) { showToast('Link não disponível', 'error'); return; }

            let telefoneLimpo = telefone.replace(/\D/g, '');
            if (!telefoneLimpo || telefoneLimpo.length < 10) {
                showToast('Telefone não cadastrado para este cliente', 'error');
                return;
            }

            if (telefoneLimpo.length === 10 || telefoneLimpo.length === 11) {
                telefoneLimpo = '55' + telefoneLimpo;
            }

            const linkOrcamento = `${window.location.origin}/p/${uuid}`;
            const empresa = _empresaNome;
            const refNum = numero ? ` Nº ${numero}` : '';

            const mensagem =
`Olá, ${nome}!

Segue o link de acesso à sua Proposta Comercial${refNum}, elaborada pela *${empresa}*:

${linkOrcamento}

Por meio deste link você pode consultar todos os detalhes e assinar eletronicamente o documento, caso deseje prosseguir.

Qualquer dúvida, estamos à disposição.

Atenciosamente,
*${empresa}*`;

            const waLink = `https://wa.me/${telefoneLimpo}?text=${encodeURIComponent(mensagem)}`;

            window.open(waLink, '_blank');
            showToast('WhatsApp aberto!', 'success');
        }

        loadEmpresaNome();
        loadHistorico();
    </script>
</body>
</html>
