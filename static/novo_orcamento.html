<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Orçamento — SaaS Budgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared.css">
    <style>
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border); padding: 12px;
            border-radius: 12px; color: var(--text-main); outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); }

        .suggestions-box {
            position: absolute; top: calc(100% + 5px); left: 0; right: 0;
            background: var(--bg-sidebar); border: 1px solid var(--glass-border);
            border-radius: 12px; z-index: 2000; display: none;
            max-height: 250px; overflow-y: auto; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
        }
        .suggestion-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--glass-border); }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: rgba(58, 123, 213, 0.1); color: var(--primary); }

        .input-with-icon { position: relative; }
        .input-with-icon i {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); cursor: pointer; transition: color 0.2s;
        }
        .input-with-icon i:hover { color: var(--primary); }

        .category-block { margin-top: 30px; border-left: 3px solid var(--primary); padding-left: 20px; margin-bottom: 40px; }
        .item-row { 
            display: grid; grid-template-columns: 2.5fr 0.8fr 1fr 1fr 1fr 1fr 40px; gap: 10px; 
            margin-bottom: 10px; align-items: end; background: rgba(255,255,255,0.01);
            padding: 10px; border-radius: 10px;
        }
        
        .total-box { margin-top: 40px; text-align: right; padding-top: 20px; border-top: 2px solid var(--glass-border); }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .cnpj-row { display: flex; gap: 10px; align-items: flex-end; }
        .cnpj-row input { flex: 1; }
        .btn-cnpj-search { padding: 12px 18px; white-space: nowrap; flex-shrink: 0; }
        .cnpj-status { font-size: 12px; margin-top: 6px; height: 16px; }
        .cnpj-status.ok  { color: #10b981; }
        .cnpj-status.err { color: #ef4444; }
        .cnpj-status.loading { color: var(--text-muted); }

        .toast-container {
            position: fixed; bottom: 24px; right: 24px;
            z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            padding: 12px 20px; border-radius: 12px; color: white;
            font-weight: 600; font-size: 14px; max-width: 320px;
            animation: toastIn 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .toast.success { background: #10b981; }
        .toast.error   { background: #ef4444; }
        .toast.info    { background: var(--primary, #3a7bd5); }
        @keyframes toastIn {
            from { transform: translateX(110%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        @media (max-width: 1200px) {
            .item-row { grid-template-columns: 1fr 1fr; }
            .item-row > div:first-child { grid-column: span 2; }
        }
        
        @media (max-width: 768px) {
            .grid-3 { grid-template-columns: 1fr; }
            .item-row { grid-template-columns: 1fr; gap: 8px; }
            .item-row > div:first-child { grid-column: span 1; }
            .category-block { padding-left: 12px; }
            .total-box { text-align: center; padding-top: 15px; }
            #total-geral { font-size: 28px !important; }
            form > .glass-panel { padding: 15px; }
            h1 { font-size: 20px; }
            h2 { font-size: 16px !important; }
            .cnpj-row input { font-size: 14px; }
        }
        
        @media (max-width: 480px) {
            .form-group { margin-bottom: 15px; }
            .form-group input, .form-group select, .form-group textarea {
                padding: 10px;
                font-size: 14px;
            }
            .btn-primary {
                padding: 14px;
                font-size: 16px;
            }
            .category-block {
                padding-left: 10px;
                margin-bottom: 25px;
            }
            .grid-3 { gap: 12px; }
            .table-container { margin: 0 -15px; padding: 0 15px; overflow-x: auto; }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-bolt"></i> <span>SaaS Budgets</span></div>
        <a href="/" class="nav-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="/novo_orcamento.html" class="nav-link active"><i class="fas fa-plus-circle"></i> Novo Orçamento</a>
        <a href="/historico.html" class="nav-link"><i class="fas fa-history"></i> Histórico</a>
        <a href="/clientes.html" class="nav-link"><i class="fas fa-users"></i> Clientes</a>
        <a href="/catalogo.html" class="nav-link"><i class="fas fa-box-open"></i> Catálogo</a>
        <div style="margin-top: auto;">
            <button class="nav-link" onclick="toggleTheme()" style="width: 100%; border: none; background: transparent; cursor: pointer;">
                <i class="fas fa-adjust" id="theme-icon"></i> <span id="theme-text">Modo Claro</span>
            </button>
            <a href="javascript:void(0)" class="nav-link" onclick="logout()" style="color: #ef4444;">
                <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
            </a>
            <a href="/configuracoes.html" class="nav-link"><i class="fas fa-cog"></i> Configurações</a>
        </div>
    </div>

    <div class="mobile-header">
        <div class="logo" style="margin:0"><i class="fas fa-bolt"></i></div>
        <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; flex-wrap: wrap; gap: 15px;">
            <div>
                <h1>Nova Proposta Comercial</h1>
                <p style="color: var(--text-muted);">Clique nos campos ou digite para selecionar itens do catálogo.</p>
            </div>
            <button type="button" class="btn" style="background: rgba(139, 92, 246, 0.15); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3);" onclick="copiarLinkCadastro()">
                <i class="fas fa-share-alt"></i> Compartilhar Link de Cadastro
            </button>
        </header>

        <form id="orcamento-form">
            <!-- Dados do Cliente -->
            <div class="glass-panel">
                <h2 style="font-size: 18px; margin-bottom: 20px; color: var(--primary);"><i class="fas fa-user-tag"></i> Cliente</h2>
                <!-- CNPJ -->
                <div class="form-group">
                    <label>CNPJ/CPF *</label>
                    <div class="cnpj-row">
                        <input type="text" id="cliente_cnpj" placeholder="00.000.000/0000-00 ou 000.000.000-00" maxlength="18" required
                            oninput="maskCNPJCPF(this)"
                            onkeydown="if(event.key==='Enter'){event.preventDefault();buscarCNPJ();}">
                        <button type="button" class="btn btn-primary btn-cnpj-search" id="btn-cnpj" onclick="buscarCNPJ()">
                            <i class="fas fa-search" id="cnpj-icon"></i> Buscar
                        </button>
                    </div>
                    <div class="cnpj-status" id="cnpj-status"></div>
                </div>

                <!-- Nome do Cliente -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Cliente (Clique para ver a lista ou digite)</label>
                        <a href="/cadastro" target="_blank" class="btn-link" style="font-size: 12px; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 5px;">
                            <i class="fas fa-plus-circle"></i> Novo Cliente
                        </a>
                    </div>
                    <div class="input-with-icon">
                        <input type="text" id="cliente_nome" placeholder="Selecione o cliente..." autocomplete="off" required onfocus="showAllClients()" onclick="showAllClients()">
                        <i class="fas fa-chevron-down" onclick="showAllClients()"></i>
                    </div>
                    <div id="client-suggestions" class="suggestions-box"></div>
                </div>

                <div class="grid-3">
                    <div class="form-group"><label>E-mail *</label><input type="email" id="cliente_email" required></div>
                    <div class="form-group"><label>Telefone *</label><input type="text" id="cliente_telefone" required></div>
                    <div class="form-group"><label>A/C (Contato)</label><input type="text" id="cliente_contato"></div>
                </div>
                <div class="form-group"><label>Endereço</label><input type="text" id="cliente_endereco" placeholder="Rua, número, bairro, cidade - UF"></div>
            </div>

            <!-- Itens -->
            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 style="font-size: 18px; color: var(--primary);"><i class="fas fa-boxes"></i> Itens e Serviços</h2>
                    <button type="button" class="btn btn-primary" style="padding: 8px 15px; font-size: 12px;" onclick="addCategory()">+ Categoria</button>
                </div>
                <div id="categories-container"></div>
                <div class="total-box">
                    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;">Investimento Total</p>
                    <h2 id="total-geral" style="font-size: 36px; font-weight: 800; color: #10b981;">R$ 0,00</h2>
                </div>
            </div>

            <!-- Condições -->
            <div class="glass-panel">
                <h2 style="font-size: 18px; margin-bottom: 20px; color: var(--primary);"><i class="fas fa-handshake"></i> Condições Comerciais</h2>
                <div class="form-group"><label>Consultor</label><select id="consultor_select"><option value="">Selecione...</option></select></div>
                <div class="form-group"><label>Resumo Técnico</label><textarea id="descricao_intro" rows="4"></textarea></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group"><label>Pagamento</label><select id="condicao_pagto"></select></div>
                    <div class="form-group"><label>Validade (Dias)</label><input type="number" id="validade_dias" value="7"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 20px; font-size: 18px;">
                <i class="fas fa-file-invoice-dollar"></i> GERAR PROPOSTA
            </button>
        </form>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script src="/shared.js?v=1.2"></script>
    <script>
        let allClients = [];
        let allCatalog = [];
        let selectedClientId = null;
        let categoriesCount = 0;
        const EDIT_ID = new URLSearchParams(window.location.search).get('id');

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'opacity 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function copiarLinkCadastro() {
            const link = window.location.origin + '/cadastro';
            navigator.clipboard.writeText(link).then(() => {
                showToast('Link de cadastro copiado!', 'success');
            }).catch(() => {
                showToast('Erro ao copiar link', 'error');
            });
        }

        async function loadConsultores() {
            const res = await apiFetch('/api/config');
            if (!res) return;
            const data = await res.json();
            const consultores = JSON.parse(data.consultores_json || '[]');
            const select = document.getElementById('consultor_select');
            consultores.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.nome;
                opt.textContent = c.nome;
                select.appendChild(opt);
            });
            if (data.consultor_nome) {
                select.value = data.consultor_nome;
            }
        }

        // ── CNPJ/CPF ───────────────────────────────────────────────────────────
        function maskCNPJCPF(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 14) v = v.slice(0, 14);
            
            if (v.length <= 11) {
                // CPF: 000.000.000-00
                v = v.replace(/(\d{3})(\d)/, '$1.$2');
                v = v.replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
                v = v.replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
            } else {
                // CNPJ: 00.000.000/0001-00
                v = v.replace(/^(\d{2})(\d)/, '$1.$2');
                v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
                v = v.replace(/(\d{4})(\d)/, '$1-$2');
            }
            input.value = v;
        }

        async function buscarCNPJ() {
            const doc = document.getElementById('cliente_cnpj').value.replace(/\D/g, '');
            const status = document.getElementById('cnpj-status');
            const btn = document.getElementById('btn-cnpj');
            const icon = document.getElementById('cnpj-icon');

            if (doc.length !== 14 && doc.length !== 11) {
                status.className = 'cnpj-status err';
                status.textContent = 'Digite um CNPJ (14 dígitos) ou CPF (11 dígitos).';
                return;
            }

            // Se for CPF, buscar na base de clientes local
            if (doc.length === 11) {
                status.className = 'cnpj-status loading';
                status.textContent = 'Buscando cliente...';
                
                const res = await apiFetch('/api/clientes');
                if (res) {
                    const clientes = await res.json();
                    const cliente = clientes.find(c => c.cnpj_cpf?.replace(/\D/g, '') === doc);
                    if (cliente) {
                        document.getElementById('cliente_nome').value = cliente.nome || '';
                        document.getElementById('cliente_email').value = cliente.email || '';
                        document.getElementById('cliente_telefone').value = cliente.telefone || '';
                        document.getElementById('cliente_endereco').value = cliente.endereco || '';
                        document.getElementById('cliente_contato').value = cliente.contato || '';
                        status.className = 'cnpj-status ok';
                        status.textContent = `✓ Cliente encontrado`;
                        showToast('Cliente encontrado na base!', 'success');
                    } else {
                        status.className = 'cnpj-status';
                        status.textContent = 'CPF válido. Preencha os dados manualmente.';
                    }
                }
                btn.disabled = false;
                icon.className = 'fas fa-search';
                return;
            }

            // CNPJ - consultar Receita Federal
            btn.disabled = true;
            icon.className = 'fas fa-spinner fa-spin';
            status.className = 'cnpj-status loading';
            status.textContent = 'Consultando Receita Federal...';

            try {
                const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${doc}`);
                if (!res.ok) throw new Error('não encontrado');
                const d = await res.json();

                const nome = d.nome_fantasia?.trim() || d.razao_social?.trim() || '';
                const partes = [d.logradouro, d.numero, d.complemento, d.bairro, d.municipio, d.uf]
                    .map(p => (p || '').trim()).filter(Boolean);
                const endereco = partes.join(', ');

                if (nome) document.getElementById('cliente_nome').value = nome;
                if (d.email) document.getElementById('cliente_email').value = d.email.toLowerCase();
                if (d.ddd_telefone_1) document.getElementById('cliente_telefone').value = formatTel(d.ddd_telefone_1);
                if (endereco) document.getElementById('cliente_endereco').value = endereco;

                status.className = 'cnpj-status ok';
                status.textContent = `✓ ${d.razao_social?.trim() || nome}`;
                showToast(`Empresa encontrada: ${nome || d.razao_social}`, 'success');

            } catch (e) {
                status.className = 'cnpj-status err';
                status.textContent = 'CNPJ não encontrado ou serviço indisponível.';
                showToast('CNPJ não encontrado na Receita Federal', 'error');
            } finally {
                btn.disabled = false;
                icon.className = 'fas fa-search';
            }
        }

        function formatTel(tel) {
            const d = tel.replace(/\D/g, '');
            if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
            if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
            return tel;
        }

        async function init() {
            try {
                const [resC, resCat, resCfg] = await Promise.all([
                    apiFetch('/api/clientes'),
                    apiFetch('/api/catalogo'),
                    apiFetch('/api/config')
                ]);
                if (!resC || !resCat || !resCfg) return;
                const clientsData = await resC.json();
                allClients = Array.isArray(clientsData) ? clientsData : [];
                
                const catalogData = await resCat.json();
                if (catalogData && typeof catalogData === 'object' && !Array.isArray(catalogData)) {
                    allCatalog = Object.values(catalogData).flat();
                } else {
                    allCatalog = Array.isArray(catalogData) ? catalogData : [];
                }

                const cfg = await resCfg.json();
                const select = document.getElementById('condicao_pagto');
                [cfg.cond_pagto_opcao1, cfg.cond_pagto_opcao2, cfg.cond_pagto_opcao3].forEach(opt => {
                    if(opt) {
                        const o = document.createElement('option');
                        o.value = opt; o.text = opt;
                        select.add(o);
                    }
                });
                addCategory(); 
            } catch (e) { console.error(e); }
        }

        // Cliente Search
        function showAllClients() {
            const box = document.getElementById('client-suggestions');
            renderClientSuggestions(allClients);
            box.style.display = 'block';
        }

        document.getElementById('cliente_nome').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allClients.filter(c => c.nome.toLowerCase().includes(val));
            renderClientSuggestions(filtered);
        };

        function renderClientSuggestions(list) {
            const box = document.getElementById('client-suggestions');
            if(list.length > 0) {
                box.innerHTML = list.map(c => `
                    <div class="suggestion-item" onclick='selectClient(${JSON.stringify(c)})'>
                        <strong>${c.nome}</strong><br><small>${c.email || ''}</small>
                    </div>
                `).join('');
                box.style.display = 'block';
            } else { box.style.display = 'none'; }
        }

        function selectClient(c) {
            selectedClientId = c.id;
            document.getElementById('cliente_nome').value = c.nome;
            document.getElementById('cliente_cnpj').value = c.cnpj_cpf || '';
            document.getElementById('cliente_email').value = c.email || '';
            document.getElementById('cliente_telefone').value = c.telefone || '';
            document.getElementById('cliente_contato').value = c.contato || '';
            document.getElementById('cliente_endereco').value = c.endereco || '';
            document.getElementById('client-suggestions').style.display = 'none';
        }

        // Categorias e Itens
        function addCategory() {
            categoriesCount++;
            const id = `cat-${categoriesCount}`;
            const html = `
                <div class="category-block" id="${id}">
                    <div style="display: flex; gap: 15px; margin-bottom: 15px; align-items: center;">
                        <input type="text" placeholder="Nome da Categoria" class="cat-name" style="flex: 1; font-weight: 700; background: transparent; border: none; border-bottom: 2px solid var(--glass-border); color: var(--text-main); font-size: 16px; outline: none;">
                        <button type="button" class="btn-icon" style="color: #ef4444;" onclick="removeElement('${id}')"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div class="items-list"></div>
                    <button type="button" class="btn" style="font-size: 11px; background: rgba(58, 123, 213, 0.1); color: var(--primary); margin-top: 10px;" onclick="addItem('${id}')"><i class="fas fa-plus"></i> Item do Catálogo</button>
                </div>
            `;
            document.getElementById('categories-container').insertAdjacentHTML('beforeend', html);
            addItem(id);
        }

        function addItem(catId) {
            const itemsList = document.querySelector(`#${catId} .items-list`);
            const itemId = `item-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
            const html = `
                <div class="item-row" id="${itemId}" data-tipo="unidade">
                    <div class="form-group" style="margin:0">
                        <label>Descrição</label>
                        <div class="input-with-icon">
                            <input type="text" placeholder="Clique ou digite..." class="item-desc" oninput="searchCatalog(this, '${itemId}')" onfocus="searchCatalog(this, '${itemId}', true)">
                            <i class="fas fa-search" onclick="this.previousElementSibling.focus()"></i>
                            <div class="suggestions-box"></div>
                        </div>
                    </div>
                    <div class="form-group" style="margin:0">
                        <label>Tipo</label>
                        <select class="item-tipo" onchange="changeTipo('${itemId}', this.value)">
                            <option value="unidade">Unidade</option>
                            <option value="metro_linear">Metro Linear (m)</option>
                            <option value="metro_quadrado">Metro Quadrado (m²)</option>
                        </select>
                    </div>
                    <div class="form-group item-qtd-group" style="margin:0"><label>Qtd</label><input type="number" value="1" step="0.01" class="item-qtd" onchange="calculateTotal()"></div>
                    <div class="form-group item-metro-group" style="margin:0; display:none;">
                        <div style="display:flex; gap:5px;">
                            <div style="flex:1;"><label>Qtd</label><input type="number" value="1" step="1" min="1" class="item-qtd-ml" onchange="calculateTotal()"></div>
                            <div style="flex:1;"><label>Metros (m)</label><input type="number" value="1" step="0.01" class="item-metros" onchange="calculateTotal()"></div>
                        </div>
                    </div>
                    <div class="form-group item-m2-group" style="margin:0; display:none;">
                        <div style="display:flex; gap:5px;">
                            <div style="flex:1;"><label>Larg (m)</label><input type="number" value="1" step="0.01" class="item-largura" onchange="calculateTotal()" placeholder="Larg"></div>
                            <div style="flex:1;"><label>Alt (m)</label><input type="number" value="1" step="0.01" class="item-altura" onchange="calculateTotal()" placeholder="Alt"></div>
                        </div>
                    </div>
                    <div class="form-group" style="margin:0"><label>Preço/un</label><input type="number" step="0.01" class="item-preco" onchange="calculateTotal()"></div>
                    <div class="form-group" style="margin:0"><label>Garantia</label><input type="text" class="item-garantia"></div>
                    <div class="form-group" style="margin:0"><label>Prazo</label><input type="text" class="item-prazo"></div>
                    <div class="form-group" style="margin:0"><label>Subtotal</label><input type="text" class="item-sub" readonly style="background: transparent; border: none; font-weight: 700; color: #10b981;"></div>
                    <button type="button" class="btn-icon" style="color: #ef4444; margin-bottom: 10px;" onclick="removeElement('${itemId}')"><i class="fas fa-times"></i></button>
                </div>
            `;
            itemsList.insertAdjacentHTML('beforeend', html);
        }

        function searchCatalog(input, rowId, showAll = false) {
            const val = input.value.toLowerCase().trim();
            const box = input.nextElementSibling.nextElementSibling;
            
            let filtered = allCatalog;
            if(!showAll && val) {
                filtered = allCatalog.filter(i => 
                    i.descricao.toLowerCase().includes(val) || 
                    (i.categoria && i.categoria.toLowerCase().includes(val))
                );
            }
            
            if(filtered.length > 0) {
                box.innerHTML = filtered.map(i => `
                    <div class="suggestion-item" onclick='selectCatalogItem("${rowId}", ${JSON.stringify(i)})'>
                        <div style="font-weight: 700; font-size: 14px;">${i.descricao}</div>
                        <div style="font-size: 11px; opacity: 0.7;">Cat: ${i.categoria || 'Geral'} | R$ ${i.preco.toLocaleString('pt-BR')}/${i.tipo === 'metro_linear' ? 'm' : 'un'}</div>
                    </div>
                `).join('');
                box.style.display = 'block';
            } else if (val) {
                box.innerHTML = '<div class="suggestion-item" style="cursor: default; opacity: 0.6;">Nenhum item encontrado...</div>';
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        function selectCatalogItem(rowId, item) {
            const row = document.getElementById(rowId);
            row.querySelector('.item-desc').value = item.descricao;
            row.querySelector('.item-preco').value = item.preco;
            row.querySelector('.item-garantia').value = item.garantia || '';
            row.querySelector('.suggestions-box').style.display = 'none';
            
            const tipo = item.tipo || 'unidade';
            row.setAttribute('data-tipo', tipo);
            row.querySelector('.item-tipo').value = tipo;

            const qtdGroup = row.querySelector('.item-qtd-group');
            const metroGroup = row.querySelector('.item-metro-group');
            const m2Group = row.querySelector('.item-m2-group');
            
            if (tipo === 'metro_linear') {
                qtdGroup.style.display = 'none';
                metroGroup.style.display = 'block';
                m2Group.style.display = 'none';
                row.querySelector('.item-metros').value = 1;
            } else if (tipo === 'metro_quadrado') {
                qtdGroup.style.display = 'none';
                metroGroup.style.display = 'none';
                m2Group.style.display = 'block';
                row.querySelector('.item-largura').value = item.largura || 1;
                row.querySelector('.item-altura').value = item.altura || 1;
            } else {
                qtdGroup.style.display = 'block';
                metroGroup.style.display = 'none';
                m2Group.style.display = 'none';
                row.querySelector('.item-qtd').value = 1;
            }
            
            const catBlock = row.closest('.category-block');
            if (catBlock) {
                const catNameInput = catBlock.querySelector('.cat-name');
                if (catNameInput) {
                    catNameInput.value = item.categoria || item.descricao;
                }
            }
            
            calculateTotal();
        }

        function changeTipo(rowId, tipo) {
            const row = document.getElementById(rowId);
            row.setAttribute('data-tipo', tipo);
            row.querySelector('.item-qtd-group').style.display = tipo === 'unidade' ? 'block' : 'none';
            row.querySelector('.item-metro-group').style.display = tipo === 'metro_linear' ? 'block' : 'none';
            row.querySelector('.item-m2-group').style.display = tipo === 'metro_quadrado' ? 'block' : 'none';
            calculateTotal();
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if(el) { el.remove(); calculateTotal(); }
        }

        function calculateTotal() {
            let totalGeral = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                const tipo = row.getAttribute('data-tipo') || 'unidade';
                let qtd, sub;
                if (tipo === 'metro_linear') {
                    const qtdMl = parseFloat(row.querySelector('.item-qtd-ml').value) || 1;
                    const metros = parseFloat(row.querySelector('.item-metros').value) || 0;
                    const preco = parseFloat(row.querySelector('.item-preco').value) || 0;
                    qtd = qtdMl * metros;
                    sub = qtdMl * metros * preco;
                } else if (tipo === 'metro_quadrado') {
                    const largura = parseFloat(row.querySelector('.item-largura').value) || 0;
                    const altura = parseFloat(row.querySelector('.item-altura').value) || 0;
                    const preco = parseFloat(row.querySelector('.item-preco').value) || 0;
                    const m2 = largura * altura;
                    sub = m2 * preco;
                    qtd = m2;
                } else {
                    qtd = parseFloat(row.querySelector('.item-qtd').value) || 0;
                    const preco = parseFloat(row.querySelector('.item-preco').value) || 0;
                    sub = qtd * preco;
                }
                row.querySelector('.item-sub').value = sub.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                totalGeral += sub;
            });
            document.getElementById('total-geral').innerText = totalGeral.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        document.getElementById('orcamento-form').onsubmit = async (e) => {
            e.preventDefault();
            const categorias = [];
            document.querySelectorAll('.category-block').forEach(cat => {
                const items = [];
                cat.querySelectorAll('.item-row').forEach(row => {
                    const desc = row.querySelector('.item-desc').value;
                    if(desc) {
                        const tipo = row.getAttribute('data-tipo') || 'unidade';
                        let quantidade = 1, metragem = 0, largura = 0, altura = 0;
                        if (tipo === 'metro_linear') {
                            const qtdMl = parseFloat(row.querySelector('.item-qtd-ml').value) || 1;
                            metragem = parseFloat(row.querySelector('.item-metros').value) || 1;
                            quantidade = qtdMl * metragem;
                        } else if (tipo === 'metro_quadrado') {
                            largura = parseFloat(row.querySelector('.item-largura').value) || 1;
                            altura = parseFloat(row.querySelector('.item-altura').value) || 1;
                            metragem = largura * altura;
                            quantidade = metragem;
                        } else {
                            quantidade = parseFloat(row.querySelector('.item-qtd').value) || 1;
                        }
                        items.push({
                            descricao: desc,
                            tipo,
                            quantidade,
                            metragem,
                            largura,
                            altura,
                            valor_unitario: parseFloat(row.querySelector('.item-preco').value) || 0,
                            garantia: row.querySelector('.item-garantia').value,
                            prazo: row.querySelector('.item-prazo').value
                        });
                    }
                });
                if(items.length > 0) {
                    categorias.push({ titulo: cat.querySelector('.cat-name').value || "Itens", itens: items });
                }
            });

            const payload = {
                cliente_id: selectedClientId,
                cliente_nome: document.getElementById('cliente_nome').value,
                cliente_cnpj: document.getElementById('cliente_cnpj').value,
                cliente_email: document.getElementById('cliente_email').value,
                cliente_telefone: document.getElementById('cliente_telefone').value,
                cliente_endereco: document.getElementById('cliente_endereco').value,
                cliente_contato: document.getElementById('cliente_contato').value,
                descricao_intro: document.getElementById('descricao_intro').value,
                consultor_nome: document.getElementById('consultor_select').value || null,
                condicao_pagto: document.getElementById('condicao_pagto').value,
                validade_dias: parseInt(document.getElementById('validade_dias').value),
                categorias: categorias
            };

            const url = EDIT_ID ? `/orcamentos/${EDIT_ID}` : '/orcamentos';
            const method = EDIT_ID ? 'PUT' : 'POST';
            const res = await apiFetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (res && res.ok) {
                window.location.href = '/historico.html';
            } else {
                const err = res ? await res.text() : 'sem resposta';
                console.error('Erro ao salvar:', err);
                showToast('Erro ao salvar orçamento. Verifique o console.', 'error');
            }
        };

        async function loadEditData() {
            if (!EDIT_ID) return;

            document.querySelector('h1').textContent = 'Editar Orçamento';
            const submitBtn = document.querySelector('#orcamento-form button[type="submit"]');
            if (submitBtn) submitBtn.innerHTML = '<i class="fas fa-save"></i> SALVAR ALTERAÇÕES';

            const res = await apiFetch(`/orcamentos/${EDIT_ID}`);
            if (!res || !res.ok) return;
            const orc = await res.json();

            document.getElementById('cliente_nome').value = orc.cliente_nome || '';
            document.getElementById('cliente_cnpj').value = orc.cliente_cnpj || '';
            document.getElementById('cliente_contato').value = orc.cliente_contato || '';
            document.getElementById('cliente_endereco').value = orc.cliente_endereco || '';
            document.getElementById('cliente_email').value = orc.cliente_email || '';
            document.getElementById('cliente_telefone').value = orc.cliente_telefone || '';
            document.getElementById('condicao_pagto').value = orc.condicao_pagto || '';
            document.getElementById('descricao_intro').value = orc.descricao_intro || '';
            document.getElementById('validade_dias').value = orc.validade_dias || 7;
            if (document.getElementById('desconto_percent'))
                document.getElementById('desconto_percent').value = orc.desconto_percent || 0;

            document.getElementById('categories-container').innerHTML = '';
            categoriesCount = 0;

            (orc.categorias || []).forEach(cat => {
                addCategory();
                const catId = `cat-${categoriesCount}`;
                const catBlock = document.getElementById(catId);

                catBlock.querySelector('.cat-name').value = cat.titulo || '';

                catBlock.querySelector('.items-list').innerHTML = '';

                (cat.itens || []).forEach(item => {
                    addItem(catId);
                    const rows = catBlock.querySelectorAll('.item-row');
                    const row = rows[rows.length - 1];
                    const rowId = row.id;
                    row.querySelector('.item-desc').value = item.descricao || '';
                    row.querySelector('.item-preco').value = item.valor_unitario || 0;
                    row.querySelector('.item-garantia').value = item.garantia || '';

                    const tipo = item.tipo || 'unidade';
                    row.querySelector('.item-tipo').value = tipo;
                    changeTipo(rowId, tipo);
                    if (tipo === 'metro_linear') {
                        row.querySelector('.item-qtd-ml').value = 1;
                        row.querySelector('.item-metros').value = item.metragem || item.quantidade || 1;
                    } else if (tipo === 'metro_quadrado') {
                        row.querySelector('.item-largura').value = item.largura || 1;
                        row.querySelector('.item-altura').value = item.altura || 1;
                    } else {
                        row.querySelector('.item-qtd').value = item.quantidade || 1;
                    }
                });
            });

            calculateTotal();
        }

        // Fechar sugestões ao clicar fora
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.input-with-icon')) {
                document.querySelectorAll('.suggestions-box').forEach(b => b.style.display = 'none');
            }
        });

        init();
        loadConsultores();
        loadEditData();
    </script>
</body>
</html>
