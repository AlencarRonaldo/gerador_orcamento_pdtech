<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — SaaS Budgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/shared.css">
    <style>
        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            padding: 12px 15px 12px 45px;
            border-radius: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(58, 123, 213, 0.1);
        }

        /* ── Category section ── */
        .cat-section { margin-bottom: 35px; }
        .cat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 0 10px;
        }
        .cat-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--primary);
            flex: 1;
        }
        .cat-count {
            font-size: 11px;
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text-muted);
        }

        /* ── List rows ── */
        .items-list { 
            display: flex; 
            flex-direction: column; 
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }
        .item-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            transition: all 0.2s;
            border-bottom: 1px solid var(--glass-border);
        }
        .item-row:last-child { border-bottom: none; }
        .item-row:hover { background: rgba(255,255,255,0.02); }

        .row-icon {
            width: 32px; height: 32px; border-radius: 10px;
            background: rgba(58, 123, 213, 0.1);
            color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .row-desc {
            flex: 1; font-size: 14px; font-weight: 500;
            color: var(--text-main);
        }
        .row-garantia {
            font-size: 12px; color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 4px 10px; border-radius: 8px;
            white-space: nowrap;
        }
        .row-preco {
            font-size: 15px; font-weight: 700; color: #10b981;
            white-space: nowrap; min-width: 100px; text-align: right;
        }
        .row-actions {
            display: flex; gap: 8px; flex-shrink: 0;
        }

        /* ── Drawer ── */
        .drawer-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); z-index: 2000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .drawer-overlay.active { opacity: 1; pointer-events: all; }
        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0; width: 450px; max-width: 95vw;
            background: var(--bg-sidebar); border-left: 1px solid var(--glass-border);
            z-index: 2001; display: flex; flex-direction: column;
            transform: translateX(110%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -20px 0 50px rgba(0,0,0,0.3);
        }
        .drawer.active { transform: translateX(0); }
        .drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 25px 30px; border-bottom: 1px solid var(--glass-border);
        }
        .drawer-header h2 { font-size: 18px; font-weight: 700; margin: 0; }
        .drawer-close {
            width: 36px; height: 36px; border-radius: 12px; border: none;
            background: rgba(255,255,255,0.05); color: var(--text-muted); font-size: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .drawer-close:hover { background: #ef4444; color: #fff; transform: rotate(90deg); }
        
        .drawer-body { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .drawer-footer {
            padding: 20px 30px; border-top: 1px solid var(--glass-border);
            display: flex; gap: 12px; background: rgba(255,255,255,0.01);
        }

        /* ── Form ── */
        .dform-label { display: block; font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        .dform-input {
            width: 100%; padding: 12px 15px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text-main); outline: none;
            font-size: 14px; transition: all 0.3s;
        }
        .dform-input:focus { border-color: var(--primary); background: rgba(255,255,255,0.05); }

        .price-wrap {
            display: flex; align-items: center;
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 12px; overflow: hidden; transition: all 0.3s;
        }
        .price-wrap:focus-within { border-color: var(--primary); background: rgba(255,255,255,0.05); }
        .price-wrap span { padding: 0 15px; color: #10b981; font-size: 14px; font-weight: 700; border-right: 1px solid var(--glass-border); }
        .price-wrap input { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 14px; font-weight: 700; }

        /* ── Suggestions ── */
        .cat-suggestions {
            position: absolute; top: calc(100% + 5px); left: 0; right: 0;
            background: var(--bg-sidebar); border: 1px solid var(--glass-border);
            border-radius: 14px; z-index: 100; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden; display: none; backdrop-filter: blur(15px);
        }
        .cat-suggestions.open { display: block; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Toast ── */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 12px; color: #fff; font-weight: 600; font-size: 14px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        @media (max-width: 768px) {
            .header-row { flex-direction: column; align-items: stretch !important; gap: 20px; }
            .search-container { max-width: none; }
            .row-garantia { display: none; }
            .drawer { width: 100%; }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-bolt"></i> <span>SaaS Budgets</span></div>
        <a href="/" class="nav-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="/novo_orcamento.html" class="nav-link"><i class="fas fa-plus-circle"></i> Novo Orçamento</a>
        <a href="/historico.html" class="nav-link"><i class="fas fa-history"></i> Histórico</a>
        <a href="/clientes.html" class="nav-link"><i class="fas fa-users"></i> Clientes</a>
        <a href="/catalogo.html" class="nav-link active"><i class="fas fa-box-open"></i> Catálogo</a>
        <div style="margin-top: auto;">
            <button class="nav-link" onclick="toggleTheme()" style="width:100%;border:none;background:transparent;cursor:pointer;">
                <i class="fas fa-adjust" id="theme-icon"></i> <span id="theme-text">Modo Claro</span>
            </button>
            <a href="javascript:void(0)" class="nav-link" onclick="logout()" style="color:#ef4444;">
                <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
            </a>
            <a href="/configuracoes.html" class="nav-link"><i class="fas fa-cog"></i> Configurações</a>
        </div>
    </div>

    <div class="mobile-header">
        <div class="logo" style="margin:0"><i class="fas fa-bolt"></i></div>
        <button class="btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>

    <main class="main-content">
        <header class="header-row" style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px;">
            <div>
                <h1>Catálogo de Itens</h1>
                <p style="color:var(--text-muted);">Produtos e serviços disponíveis para seus orçamentos.</p>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" id="search-input" placeholder="Buscar por descrição ou categoria..." oninput="renderCatalogo()">
            </div>
            <button class="btn btn-primary" onclick="openDrawer()">
                <i class="fas fa-plus"></i> Novo Item
            </button>
        </header>

        <div id="catalogo-content">
            <div style="text-align: center; padding: 100px 0;">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 30px; color: var(--primary);"></i>
            </div>
        </div>
    </main>

    <!-- Drawer -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2 id="drawer-title">Novo Item</h2>
            <button class="drawer-close" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-body">
            <input type="hidden" id="item-id">

            <div>
                <label class="dform-label">Descrição do Item</label>
                <input class="dform-input" type="text" id="item-descricao" placeholder="Ex: Câmera IP 4MP Full HD" required>
            </div>

            <div style="position: relative;">
                <label class="dform-label">Categoria</label>
                <input class="dform-input" type="text" id="item-categoria" 
                       placeholder="Ex: Equipamentos, Serviços..." 
                       autocomplete="off"
                       oninput="onCatInput()"
                       onfocus="openCatSuggestions()"
                       onblur="setTimeout(closeCatSuggestions, 200)">
                <div class="cat-suggestions" id="cat-suggestions"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label class="dform-label">Garantia</label>
                    <input class="dform-input" type="text" id="item-garantia" placeholder="Ex: 12 meses">
                </div>
                <div>
                    <label class="dform-label">Preço Unitário</label>
                    <div class="price-wrap">
                        <span>R$</span>
                        <input type="number" id="item-preco" step="0.01" min="0" placeholder="0,00" required>
                    </div>
                </div>
            </div>
        </div>
        <div class="drawer-footer">
            <button type="button" class="btn" style="flex: 1; background: rgba(255,255,255,0.05);" onclick="closeDrawer()">Cancelar</button>
            <button type="button" class="btn btn-primary" style="flex: 1.5;" onclick="saveItem()">
                <i class="fas fa-save"></i> Salvar Item
            </button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/shared.js?v=1.2"></script>
    <script>
        let catalogoGroups = {};

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type === 'success' ? '' : type}`;
            t.style.background = type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : 'var(--primary)');
            t.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity='0'; t.style.transition='0.3s'; setTimeout(()=>t.remove(),300); }, 3000);
        }

        function renderCatalogo() {
            const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
            const content = document.getElementById('catalogo-content');
            let html = '';
            let totalFound = 0;

            for (const [cat, items] of Object.entries(catalogoGroups)) {
                const filtered = q ? items.filter(i => i.descricao.toLowerCase().includes(q) || cat.toLowerCase().includes(q)) : items;
                if (!filtered.length) continue;
                totalFound += filtered.length;

                html += `
                    <div class="cat-section">
                        <div class="cat-header">
                            <span class="cat-label">${cat}</span>
                            <span class="cat-count">${filtered.length} itens</span>
                        </div>
                        <div class="items-list">
                            ${filtered.map(item => `
                                <div class="item-row">
                                    <div class="row-icon">
                                        <i class="fas ${cat.toLowerCase().includes('servi') || cat.toLowerCase().includes('mão') ? 'fa-wrench' : 'fa-box'}"></i>
                                    </div>
                                    <span class="row-desc">${item.descricao}</span>
                                    <span class="row-garantia">${item.garantia || 'Sem gar.'}</span>
                                    <span class="row-preco">${item.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                                    <div class="row-actions">
                                        <button class="btn-icon" onclick="editItem(${item.id})" title="Editar"><i class="fas fa-pencil-alt"></i></button>
                                        <button class="btn-icon" onclick="deleteItem(${item.id})" style="color: #ef4444;" title="Excluir"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (!totalFound) {
                html = `
                    <div style="text-align: center; padding: 80px 20px;">
                        <i class="fas fa-search" style="font-size: 50px; color: var(--glass-border); margin-bottom: 20px; display: block;"></i>
                        <h3 style="color: var(--text-muted);">${q ? 'Nenhum item encontrado' : 'Catálogo vazio'}</h3>
                        <p style="color: var(--text-muted); font-size: 14px;">${q ? 'Tente outros termos de busca.' : 'Comece adicionando seu primeiro produto ou serviço.'}</p>
                    </div>
                `;
            }

            content.innerHTML = html;
        }

        async function loadCatalogo() {
            const res = await apiFetch('/api/catalogo');
            if (!res) return;
            catalogoGroups = await res.json();
            renderCatalogo();
        }

        // Suggestions Logic
        function getAllCats() {
            return [...new Set(['Equipamentos', 'Mão de Obra', 'Serviços', 'Infraestrutura', ...Object.keys(catalogoGroups)])];
        }

        function renderCatSuggestions(filter = '') {
            const box = document.getElementById('cat-suggestions');
            const all = getAllCats();
            const q = filter.trim().toLowerCase();
            const filtered = q ? all.filter(c => c.toLowerCase().includes(q)) : all;

            box.innerHTML = filtered.map(cat => `
                <div class="cat-sug-item" style="padding: 12px 15px; cursor: pointer; transition: 0.2s; font-size: 14px; display: flex; align-items: center; gap: 10px;" 
                     onmousedown="selectCat('${cat.replace(/'/g,"\\'")}')">
                    <i class="fas fa-tag" style="font-size: 10px; color: var(--primary);"></i>
                    <span>${cat}</span>
                </div>
            `).join('') || (q ? `<div style="padding: 12px 15px; font-size: 14px; color: var(--primary); cursor: pointer;" onmousedown="selectCat('${filter}')"><i class="fas fa-plus"></i> Criar "${filter}"</div>` : '');
        }

        function selectCat(cat) {
            document.getElementById('item-categoria').value = cat;
            closeCatSuggestions();
        }
        function onCatInput() {
            renderCatSuggestions(document.getElementById('item-categoria').value);
            document.getElementById('cat-suggestions').classList.add('open');
        }
        function openCatSuggestions() {
            renderCatSuggestions(document.getElementById('item-categoria').value);
            document.getElementById('cat-suggestions').classList.add('open');
        }
        function closeCatSuggestions() {
            document.getElementById('cat-suggestions').classList.remove('open');
        }

        function openDrawer(editData = null) {
            const dr = document.getElementById('drawer');
            const ov = document.getElementById('drawer-overlay');
            if (editData) {
                document.getElementById('drawer-title').textContent = 'Editar Item';
                document.getElementById('item-id').value = editData.id;
                document.getElementById('item-descricao').value = editData.descricao;
                document.getElementById('item-garantia').value = editData.garantia || '';
                document.getElementById('item-preco').value = editData.preco;
                document.getElementById('item-categoria').value = editData.categoria || '';
            } else {
                document.getElementById('drawer-title').textContent = 'Novo Item';
                ['item-id','item-descricao','item-garantia','item-preco','item-categoria'].forEach(id => document.getElementById(id).value = '');
            }
            dr.classList.add('active');
            ov.classList.add('active');
            setTimeout(() => document.getElementById('item-descricao').focus(), 400);
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('active');
            document.getElementById('drawer-overlay').classList.remove('active');
        }

        async function saveItem() {
            const id = document.getElementById('item-id').value;
            const payload = {
                descricao: document.getElementById('item-descricao').value.trim(),
                categoria: document.getElementById('item-categoria').value.trim(),
                garantia: document.getElementById('item-garantia').value.trim(),
                preco: parseFloat(document.getElementById('item-preco').value),
                ativo: true, ordem: 0
            };

            if (!payload.descricao || !payload.categoria || isNaN(payload.preco)) {
                showToast('Preencha os campos obrigatórios!', 'error');
                return;
            }

            const res = await apiFetch(id ? `/api/catalogo/${id}` : '/api/catalogo', {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res && res.ok) {
                showToast(id ? 'Item atualizado!' : 'Item adicionado com sucesso!', 'success');
                closeDrawer();
                loadCatalogo();
            }
        }

        function editItem(id) {
            for (const items of Object.values(catalogoGroups)) {
                const found = items.find(i => i.id === id);
                if (found) { openDrawer(found); return; }
            }
        }

        async function deleteItem(id) {
            if(confirm('Remover este item do catálogo?')) {
                const res = await apiFetch(`/api/catalogo/${id}`, { method: 'DELETE' });
                if (res && res.ok) {
                    showToast('Item removido.', 'info');
                    loadCatalogo();
                }
            }
        }

        loadCatalogo();
    </script>
</body>
</html>
