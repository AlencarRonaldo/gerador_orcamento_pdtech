<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Itens — Sistema de Orçamentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .badge-ativo { background:#dcfce7; color:#166534; }
    .badge-inativo { background:#f3f4f6; color:#6b7280; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="text-white px-6 py-3 flex items-center justify-between shadow" id="nav" style="background:#0097b2">
  <span class="font-bold text-lg tracking-wide">📦 Catálogo de Itens</span>
  <div class="flex gap-3 text-sm">
    <a href="/configuracoes.html" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition">⚙️ Configurações</a>
    <a href="/historico.html" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition">📋 Histórico</a>
    <a href="/" class="bg-white font-semibold px-3 py-1.5 rounded-lg hover:bg-blue-50 transition" id="nav-link-orc" style="color:#0097b2">+ Orçamento</a>
  </div>
</nav>

<!-- Modal Novo/Editar Item -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md">
    <h3 id="modal-titulo" class="text-lg font-bold text-gray-800 mb-4">Novo Item</h3>
    <input type="hidden" id="item-id">
    <div class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Categoria <span class="text-red-500">*</span></label>
        <div class="flex gap-2">
          <select id="item-categoria-sel" onchange="mudouCategoriaSelect()"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
            <option value="">-- Selecione ou crie nova --</option>
            <option value="__nova__">+ Nova categoria...</option>
          </select>
          <input id="item-categoria-nova" type="text" placeholder="Nome da nova categoria"
            class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2] hidden">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Descrição <span class="text-red-500">*</span></label>
        <input id="item-descricao" type="text" placeholder="Ex: Instalação câmera IP/Analógica"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Preço (R$) <span class="text-red-500">*</span></label>
          <input id="item-preco" type="number" step="0.01" min="0" placeholder="0,00"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Garantia Padrão</label>
          <input id="item-garantia" type="text" placeholder="Ex: 12 Meses"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2]">
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" id="item-ativo" checked class="w-4 h-4 text-[#0097b2] rounded">
        <label for="item-ativo" class="text-sm text-gray-600">Item ativo (aparece nas sugestões ao criar orçamento)</label>
      </div>
    </div>
    <div class="flex gap-3 mt-5">
      <button onclick="fecharModal()" class="flex-1 border border-gray-300 text-gray-600 font-semibold py-2 rounded-xl hover:bg-gray-50">Cancelar</button>
      <button onclick="salvarItem()" class="flex-1 bg-[#0097b2] text-white font-semibold py-2 rounded-xl hover:bg-[#007d96] transition">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Confirmar exclusão -->
<div id="modal-excluir" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center">
    <div class="text-4xl mb-3">🗑️</div>
    <h3 class="text-lg font-bold text-gray-800 mb-2">Excluir item?</h3>
    <p id="modal-excluir-desc" class="text-sm text-gray-500 mb-5"></p>
    <div class="flex gap-3">
      <button onclick="document.getElementById('modal-excluir').classList.add('hidden')" class="flex-1 border border-gray-300 text-gray-600 py-2 rounded-xl font-semibold hover:bg-gray-50">Cancelar</button>
      <button id="btn-confirmar-excluir" class="flex-1 bg-red-500 text-white py-2 rounded-xl font-semibold hover:bg-red-600">Excluir</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed top-5 right-5 z-50 bg-green-600 text-white px-5 py-3 rounded-xl shadow-lg font-medium text-sm">
  ✅ <span id="toast-msg">Salvo!</span>
</div>

<main class="max-w-6xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-700">Catálogo de Itens</h1>
      <p class="text-sm text-gray-400 mt-1">Gerencie os produtos, serviços e mão de obra que aparecem nos orçamentos.</p>
    </div>
    <div class="flex gap-3">
      <input id="busca" type="text" placeholder="🔍 Buscar item..." oninput="filtrarExibicao()"
        class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#0097b2] w-48">
      <button onclick="abrirModalNovo()"
        class="bg-[#0097b2] text-white font-semibold px-5 py-2 rounded-xl hover:bg-[#007d96] transition shadow">
        + Novo Item
      </button>
    </div>
  </div>

  <div id="vazio" class="hidden text-center py-16 text-gray-400">
    <div class="text-5xl mb-4">📦</div>
    <p class="text-lg font-medium">Catálogo vazio</p>
    <p class="text-sm mt-1">Adicione seus serviços, produtos e mão de obra.</p>
    <button onclick="abrirModalNovo()" class="mt-4 bg-[#0097b2] text-white px-6 py-2 rounded-xl font-semibold hover:bg-[#007d96] transition">
      + Adicionar primeiro item
    </button>
  </div>

  <div id="loading" class="text-gray-400 text-sm">Carregando catálogo...</div>
  <div id="catalogo-container"></div>
</main>

<script>
  let catalogoData = {}; // { categoria: [itens] }
  let categoriasDisponiveis = [];

  // ── Formatação ────────────────────────────────────────────────────────────
  function moeda(val) {
    return 'R$ ' + (val||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  // ── Carregar catálogo ─────────────────────────────────────────────────────
  async function carregarCatalogo() {
    try {
      const resp = await fetch('/api/catalogo');
      catalogoData = await resp.json();
      document.getElementById('loading').classList.add('hidden');
      atualizarSelectCategorias();
      renderizarCatalogo();
    } catch(e) {
      document.getElementById('loading').textContent = 'Erro ao carregar catálogo.';
    }
  }

  function atualizarSelectCategorias() {
    categoriasDisponiveis = Object.keys(catalogoData).sort();
    const sel = document.getElementById('item-categoria-sel');
    const valorAtual = sel.value;
    sel.innerHTML = '<option value="">-- Selecione ou crie nova --</option>';
    categoriasDisponiveis.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      sel.appendChild(opt);
    });
    const optNova = document.createElement('option');
    optNova.value = '__nova__';
    optNova.textContent = '+ Nova categoria...';
    sel.appendChild(optNova);
    if (valorAtual && valorAtual !== '__nova__') sel.value = valorAtual;
  }

  function renderizarCatalogo() {
    const container = document.getElementById('catalogo-container');
    const busca = document.getElementById('busca').value.toLowerCase();
    container.innerHTML = '';

    const categorias = Object.keys(catalogoData).sort();
    let totalItens = 0;

    categorias.forEach(cat => {
      let itens = catalogoData[cat];
      if (busca) {
        itens = itens.filter(i => i.descricao.toLowerCase().includes(busca) || i.categoria.toLowerCase().includes(busca));
      }
      if (itens.length === 0) return;
      totalItens += itens.length;

      const section = document.createElement('div');
      section.className = 'mb-6';
      section.innerHTML = `
        <div class="flex items-center gap-3 mb-3">
          <h2 class="text-base font-semibold text-gray-700 uppercase tracking-wide">${cat}</h2>
          <span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">${itens.length} iten${itens.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="bg-white rounded-xl shadow overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-[#e8f7fa] text-[#0097b2]">
              <tr>
                <th class="text-left px-4 py-3 font-semibold">Descrição</th>
                <th class="text-right px-4 py-3 font-semibold w-32">Preço</th>
                <th class="text-center px-4 py-3 font-semibold w-28">Garantia</th>
                <th class="text-center px-4 py-3 font-semibold w-20">Status</th>
                <th class="px-4 py-3 w-24"></th>
              </tr>
            </thead>
            <tbody>
              ${itens.map((item, i) => `
                <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 transition">
                  <td class="px-4 py-3 text-gray-800 font-medium">${item.descricao}</td>
                  <td class="px-4 py-3 text-right font-semibold text-[#0097b2]">${moeda(item.preco)}</td>
                  <td class="px-4 py-3 text-center text-gray-500">${item.garantia}</td>
                  <td class="px-4 py-3 text-center">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${item.ativo ? 'badge-ativo' : 'badge-inativo'}">
                      ${item.ativo ? 'Ativo' : 'Inativo'}
                    </span>
                  </td>
                  <td class="px-4 py-3">
                    <div class="flex gap-1 justify-end">
                      <button onclick="abrirModalEditar(${JSON.stringify(item).replace(/"/g,'&quot;')})"
                        class="bg-gray-100 text-gray-600 text-xs font-semibold px-2.5 py-1.5 rounded-lg hover:bg-gray-200 transition">Editar</button>
                      <button onclick="confirmarExcluir(${item.id}, '${item.descricao.replace(/'/g,'\\\'')}')"
                        class="bg-red-50 text-red-500 text-xs font-semibold px-2.5 py-1.5 rounded-lg hover:bg-red-100 transition">✕</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      container.appendChild(section);
    });

    document.getElementById('vazio').classList.toggle('hidden', totalItens > 0 || busca !== '');
  }

  function filtrarExibicao() { renderizarCatalogo(); }

  // ── Modal ─────────────────────────────────────────────────────────────────
  function abrirModalNovo() {
    document.getElementById('modal-titulo').textContent = 'Novo Item';
    document.getElementById('item-id').value = '';
    document.getElementById('item-categoria-sel').value = '';
    document.getElementById('item-categoria-nova').value = '';
    document.getElementById('item-categoria-nova').classList.add('hidden');
    document.getElementById('item-descricao').value = '';
    document.getElementById('item-preco').value = '';
    document.getElementById('item-garantia').value = '12 Meses';
    document.getElementById('item-ativo').checked = true;
    document.getElementById('modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('item-descricao').focus(), 50);
  }

  function abrirModalEditar(item) {
    document.getElementById('modal-titulo').textContent = 'Editar Item';
    document.getElementById('item-id').value = item.id;
    atualizarSelectCategorias();
    document.getElementById('item-categoria-sel').value = item.categoria;
    document.getElementById('item-categoria-nova').classList.add('hidden');
    document.getElementById('item-descricao').value = item.descricao;
    document.getElementById('item-preco').value = item.preco;
    document.getElementById('item-garantia').value = item.garantia;
    document.getElementById('item-ativo').checked = item.ativo;
    document.getElementById('modal').classList.remove('hidden');
  }

  function fecharModal() {
    document.getElementById('modal').classList.add('hidden');
  }

  function mudouCategoriaSelect() {
    const val = document.getElementById('item-categoria-sel').value;
    const novaInput = document.getElementById('item-categoria-nova');
    if (val === '__nova__') {
      novaInput.classList.remove('hidden');
      novaInput.focus();
    } else {
      novaInput.classList.add('hidden');
    }
  }

  function obterCategoria() {
    const sel = document.getElementById('item-categoria-sel').value;
    if (sel === '__nova__') {
      return document.getElementById('item-categoria-nova').value.trim();
    }
    return sel;
  }

  async function salvarItem() {
    const id = document.getElementById('item-id').value;
    const categoria = obterCategoria();
    const descricao = document.getElementById('item-descricao').value.trim();
    const preco = parseFloat(document.getElementById('item-preco').value) || 0;
    const garantia = document.getElementById('item-garantia').value.trim() || '12 Meses';
    const ativo = document.getElementById('item-ativo').checked;

    if (!categoria) { alert('Selecione ou crie uma categoria.'); return; }
    if (!descricao) { alert('Preencha a descrição do item.'); return; }
    if (preco < 0) { alert('O preço não pode ser negativo.'); return; }

    const payload = { categoria, descricao, preco, garantia, ativo, ordem: 0 };

    try {
      const url = id ? `/api/catalogo/${id}` : '/api/catalogo';
      const method = id ? 'PUT' : 'POST';
      const resp = await fetch(url, {
        method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      if (!resp.ok) throw new Error(await resp.text());
      fecharModal();
      await carregarCatalogo();
      mostrarToast(id ? 'Item atualizado!' : 'Item adicionado!');
    } catch(e) {
      alert('Erro ao salvar item: ' + e.message);
    }
  }

  // ── Excluir ───────────────────────────────────────────────────────────────
  function confirmarExcluir(id, descricao) {
    document.getElementById('modal-excluir-desc').textContent = `"${descricao}"`;
    document.getElementById('btn-confirmar-excluir').onclick = () => excluirItem(id);
    document.getElementById('modal-excluir').classList.remove('hidden');
  }

  async function excluirItem(id) {
    try {
      const resp = await fetch(`/api/catalogo/${id}`, { method: 'DELETE' });
      if (!resp.ok) throw new Error();
      document.getElementById('modal-excluir').classList.add('hidden');
      await carregarCatalogo();
      mostrarToast('Item excluído.');
    } catch(e) {
      alert('Erro ao excluir item.');
    }
  }

  // ── Toast ─────────────────────────────────────────────────────────────────
  function mostrarToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 2500);
  }

  // ── Cor dinâmica da nav ───────────────────────────────────────────────────
  async function aplicarCorDaConfig() {
    try {
      const cfg = await (await fetch('/api/config')).json();
      const cor = cfg.cor_primaria || '#0097b2';
      document.getElementById('nav').style.backgroundColor = cor;
      document.getElementById('nav-link-orc').style.color = cor;
      document.querySelector('style').textContent += `
        .focus\\:ring-\\[\\#0097b2\\]:focus { --tw-ring-color: ${cor}; }
        .text-\\[\\#0097b2\\] { color: ${cor}; }
        .bg-\\[\\#0097b2\\] { background-color: ${cor}; }
        thead.bg-\\[\\#e8f7fa\\] { background-color: ${cor}20; }
      `;
    } catch(e) {}
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  carregarCatalogo();
  aplicarCorDaConfig();

  // Fechar modal com ESC
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      fecharModal();
      document.getElementById('modal-excluir').classList.add('hidden');
    }
  });
</script>
</body>
</html>
